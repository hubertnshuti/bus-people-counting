[env:esp32doit-devkit-v1]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino

monitor_speed = 115200
upload_speed = 921600

; larger app partition — WiFi + HTTPClient + future code won't hit the 1.3 MB ceiling
board_build.partitions = huge_app.csv

lib_deps =
    marcoschwartz/LiquidCrystal_I2C@^1.1.4
    ; WiFi.h, HTTPClient.h, ESPmDNS.h are part of the ESP32 Arduino core
